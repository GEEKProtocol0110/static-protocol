[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "static-protocol-reference"
version = "0.2.0"
description = "Deterministic, simulation-only STATIC settlement reference engine"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
static-sim = "static_protocol.__main__:main"

[tool.setuptools.packages.find]
include = ["static_protocol*"]
